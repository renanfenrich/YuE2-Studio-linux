name: CI

# The service's tests on Windows and Linux, and the interface
# type-checked, tested and built, on every branch pushed.

on:
  push:
    branches-ignore: [main]
    paths-ignore: ["docs/stars-*.svg"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build pkg-config autoconf automake libtool nasm libasound2-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
      - name: Service tests
        run: cargo test --workspace --locked
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 22
      - name: Linux service lifecycle and media smoke
        if: runner.os == 'Linux'
        run: |
          cargo build -p music-server --locked
          node scripts/smoke-linux-service.mjs target/debug/music-server

  interface:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the news page's changelog is read from the history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Types
        run: npx tsc --noEmit -p .
      - name: Tests
        run: npm test
